{k:"say",t:`預賽結束，主將上場！|裁判：「接下來是第 ${i+1} 輪的正賽，雙方準備！」`},
{k:"fight",solo:()=>G.st.s1.u,f:()=>[sf(id,L,{bm:1,dm:1})],m:`第${i+1}輪對手`,after:()=>{const k=G.mons[G.st.s1.u];if(k.L<L){k.L=L;k.xp=0}k.hp=mh(k);k.pp={}}}]),
{k:"say",t:"九輪之中的第八場，在眾人屏息的注視下結束了。熊徒弟喘著大氣，汗水沿著下巴滴落，卻依然站得筆直。|觀眾席爆出如雷的掌聲，有人高喊著牠的名字，有人揮舞著手巾。|你：「我們……已經打進決賽了。」|熊徒弟轉頭看你，眼眶竟微微泛紅。"},
{k:"say",t:"回到休息室，博士已經在那裡等著。他的神情，卻比平常嚴肅許多。|博士：「有件事我必須先告訴你們。決賽的對手……不太一樣。」|你：「不太一樣？是更強的選手嗎？」|博士沉默了一會兒：「是『規則之外』的存在。主辦單位臨時換掉了決賽選手。」|「我也是剛剛才聽說的。」"},
{k:"say",t:"熊徒弟聽完，沒有害怕，反而慢慢站起身，用雙手拍了拍自己的臉頰。|你：「你真的要上嗎？就算對手不公平？」|牠點頭，用力一指競技場的方向。|博士輕輕嘆了口氣：「……也許，這就是格鬥家吧。」|你：「那我就站在場邊，看你打到最後。」|廣播聲響起：「決賽，即將開始！」"},
{k:"say",t:"決賽！|場邊廣播：「決賽對手——幻之寶可夢 凱路迪歐，Lv80！」|觀眾：「這不公平吧！熊徒弟才 Lv70 耶！」「凱路迪歐根本是犯規等級！」|裁判：「……規則就是規則，決賽照常進行！」"},
{k:"fight",solo:()=>G.st.s1.u,fin:1,f:()=>[sf(647,80,{ko:1,bm:1,dm:1})],m:"決賽・凱路迪歐",after:()=>{const k=G.mons[G.st.s1.u];k.L=Math.min(LM,top3(k.u));k.xp=0;k.hp=mh(k);k.pp={}}},
{k:"say",t:"凱路迪歐倒下的那一瞬間，整個競技場像是靜止了。|然後——掌聲、歡呼、哭聲同時爆發，連地面都在微微顫動。|觀眾們站起身，高喊著熊徒弟的名字。有人把帽子拋向天空，有人緊緊抱住身旁的陌生人。|你站在場邊，雙腿發軟，眼眶發熱。"},
{k:"say",t:"對手席上，凱路迪歐緩緩站起，朝熊徒弟點了點頭，化作一道藍光消失了。|廣播：「凱路迪歐……選擇了離場。這場比賽，勝者無庸置疑！」|熊徒弟轉過身，朝你這邊揮了揮手，臉上掛著笑。|你高高舉起雙手，用盡全力喊了一聲：「你是最棒的！」"},
{k:"say",t:()=>`全場歡聲雷動！|裁判高舉你的手：「優勝者——${nm(G.mons[G.st.s1.u])}！」|博士：「太了不起了！牠在最危急的時刻，靠著大家的聲援突破了極限，進化了！」|${nm(G.mons[G.st.s1.u])}挺起胸膛，對你重重地點了點頭。（等級成為你最強前三名寶可夢的平均：Lv${G.mons[G.st.s1.u].L}）|獲得優勝獎金 $100000！`,fx:()=>{G.money+=100000;M="支線「武人的驕傲」完成！武道熊師已解除限定。"}}];
const S2=[
{k:"say",t:"入夜後，包包裡的鳳王之羽忽然散發出七彩的光芒，像是在呼喚著什麼。|羽毛的光芒指向遙遠的東方——那座傳說中的鈴鐺塔。|你決定循著光芒出發。"},
{k:"say",t:"一路上，羽毛的光芒時明時暗，像是在回應你的腳步。|旅途中經過一座沉睡的小鎮，鎮上的居民看見羽毛，紛紛放下手邊的工作，對你遠遠地鞠躬。|一位老婆婆悄悄塞給你一包糰子：「這是給旅人的。願彩虹一路指引你。」|你：「彩虹……？」老婆婆只是微笑，不再多說。"},
{k:"say",t:"夜裡，你在山腳紮營。篝火旁，你把羽毛捧在掌心端詳。|羽毛上的七彩紋路，像是一道封印的符文，在火光下緩緩流動。|你的夥伴們圍坐在身邊，有的打盹，有的好奇地盯著羽毛。|你：「到底，是什麼在呼喚我們呢……」|遠處的山頭上，一座高塔的輪廓，若隱若現。"},
{k:"say",t:"第三天清晨，你終於站在鈴鐺塔的山門前。|山風送來清脆的鈴聲，一聲、兩聲、三聲，像是在歡迎，也像是在試探。|石階蜿蜒而上，兩旁的石燈籠一座座點亮，彷彿專為你而燃。|你深吸一口氣，邁出第一步。"},
{k:"say",t:"鈴鐺塔矗立在雲霧之中。塔門前，一位拄著拐杖的老人早已等候多時。|老人：「那光……是鳳王之羽！上一次看見它發光，已是百年前的事了。」|「年輕人，鳳王不會輕易現身。想見牠，必須先通過守塔的三道試煉。」|「第一道，是『烈焰之試』——證明你的隊伍不怕火焰。」"},
{k:"say",t:"老人領你走進塔底的火之殿。四周的牆壁燃燒著永不熄滅的火焰，熱浪撲面而來。|老人：「烈焰之試，考驗的不是能不能打贏，而是能不能在火焰中保持冷靜。」|「守衛們共有兩批。第一批是『灼熱的衛兵』，第二批，是『守衛長』率領的精銳。」|你：「也就是說，要連戰兩場？」|老人：「正是。」"},
{k:"fight",f:()=>byT([1],4),m:"灼熱的衛兵",rw:()=>avgL()*150},
{k:"say",t:"火焰衛兵倒下後，殿中央的大鼎突然噴出一道火柱。|老人：「第一批通過了。但守衛長不會因為同伴倒下就手軟。」|你的夥伴們身上都沾著煙灰，卻沒有一個人退縮。|你：「再來！」"},
{k:"fight",f:()=>byT([1],5),m:"烈焰守衛長",rw:()=>avgL()*300},
{k:"say",t:"老人：「好！第一道試煉通過。」|正當你準備登塔時，塔外傳來雜亂的腳步聲——幾個黑衣人衝了進來。|黑衣人：「那根羽毛，交出來！我們要用它喚醒鳳王，獻給首領大人！」|老人：「小心，他們是衝著鳳王之羽來的！」"},
{k:"fight",f:()=>byT([15],4),m:"黑衣人",rw:()=>avgL()*200},
{k:"say",t:"最後一名黑衣人跪倒在地，卻忽然獰笑：「你以為這樣就結束了？首領大人早就料到了——」|他吹響口哨，塔外湧入更多披著黑斗篷的身影，為首的人，周身繚繞著不祥的黑霧。|老人：「是暗影的氣息！小心別被黑霧碰到！」"},
{k:"fight",f:()=>byT([15,13],5,{sh:1}),m:"黑衣首領與暗影部隊",rw:()=>avgL()*350},
{k:"say",t:"黑衣人落荒而逃，掉下了一張紙條：「……暗影的力量，將在鳳王身上覺醒……」|老人臉色凝重：「他們想利用鳳王的力量。我們必須搶在他們之前抵達塔頂。」|「第二道試煉，是『天空之試』。塔頂風勢強勁，只有真正能飛翔的寶可夢才站得穩。」"},
{k:"say",t:"塔身越來越高，風也越來越強。|你抓著欄杆，一步一步往上爬，衣角被吹得啪啪作響。|老人在前方回頭喊道：「不要往下看！塔外的風，可以把人吹出去！」|你：「這、這種高度，我的夥伴們撐得住嗎？」|你回頭，夥伴們卻一個比一個興奮——牠們似乎很享受這陣風。"},
{k:"fight",f:()=>byT([9],4),m:"天空守衛",rw:()=>avgL()*200},
{k:"say",t:"第一波天空守衛被擊退，雲層中卻傳來更尖銳的鳴叫。|一群羽翼如刀的飛行寶可夢，從更高的塔頂俯衝而下。|老人：「是守塔長老的親衛隊！把牠們也打敗，塔頂就在眼前了。」"},
{k:"fight",f:()=>byT([9],5),m:"天空長老親衛隊",rw:()=>avgL()*400},
{k:"say",t:"你一步一步登上塔頂。雲層裂開，雨滴灑落。|遠方的天空出現了一道巨大的彩虹，七彩的光輝照在鳳王之羽上，羽毛輕輕地浮了起來。|老人：「第三道試煉，是『聖獸之試』。傳說三聖獸為了守護鳳王而復活，只有牠們認可的人，才能見到鳳王。」|雲間傳來雷鳴、烈焰與水聲——三道身影在雲層後若隱若現。"},
{k:"say",t:"三道身影並未一起行動。最先降下的，是一團籠罩著雷電的影子。|雷鳴震耳欲聾，一頭黃色的野獸踏著閃電，緩緩現身。|老人：「雷公……牠先來考驗你。」"},
{k:"fight",f:()=>[wf(243)],m:"雷公",rw:()=>avgL()*200},
{k:"say",t:"雷聲漸遠，空氣中卻傳來灼人的熱度。|烈焰從雲層深處噴湧而出，一頭火焰之獸踏著赤色的光輝降臨。|老人：「炎帝……牠要看的，是你面對火焰時的決心。」"},
{k:"fight",f:()=>[wf(244)],m:"炎帝",rw:()=>avgL()*200},
{k:"say",t:"火光漸息，這次，是細密的水氣包住了塔頂。|一頭蒼藍的身影立在雨幕之中，眼神安靜卻凌厲。|老人：「水君……最後一位，也是最沉穩的考官。」"},
{k:"fight",f:()=>[wf(245)],m:"水君",rw:()=>avgL()*200},
{k:"say",t:"三聖獸各自退到一旁，站成一個三角形，彼此對望了一眼。|忽然，三道光芒同時衝向天空——|老人：「不好！牠們要聯手了！這是最後一關，無論如何要撐住！」"},
{k:"fight",f:()=>[wf(243),wf(244),wf(245)],m:"三聖獸",rw:()=>avgL()*600},
{k:"say",t:"三聖獸對你低下了頭，化作光芒消失在雲間。|雲層深處傳來一聲清亮的鳴叫——|七彩的羽翼劃破天際，鳳王緩緩降臨在塔頂。|鳳王：「……持有羽毛的人類啊。我想看看，你和寶可夢之間的羈絆，是否真如這道彩虹般閃耀。」"},
{k:"say",t:"鳳王抖動羽翼，七道光芒從牠的身後散開，化作一道道彩色的幻影，擋在你面前。|鳳王：「在與我交手之前，請先通過這些『彩虹的碎片』。牠們是我羽翼上落下的記憶。」|老人在一旁輕聲說：「這是最後的考驗了。」"},
{k:"fight",f:()=>byT([1,9],4),m:"彩虹的幻影",rw:()=>avgL()*400},
{k:"say",t:"幻影一個個消散，化作點點光粒，飄向鳳王的羽翼。|鳳王靜靜地看著你，眼神平靜如水。|鳳王：「……很好。那麼，接下來是真正的我。」|七彩的風，在塔頂狂暴地捲了起來。"},
{k:"fight",f:()=>[...byT([1,9],2),wf(250)],m:"鳳王與牠的護衛",cap:.1,rw:()=>avgL()*1000},
{k:"say",t:"鳳王倒在塔頂，七彩的光芒慢慢收斂。|你上前一步，卻發現鳳王並沒有受傷——牠只是靜靜地閉著眼，彷彿在聆聽什麼。|老人低聲說：「牠在聽你的夥伴們的心跳聲。」|每一隻寶可夢，都輕輕靠近了你，彷彿在回應。"},
{k:"say",t:"鳳王睜開眼睛，眼神裡再沒有試探，只剩下溫柔。|鳳王：「百年來，我見過許多人。有人想要我的力量，有人想要我的羽毛，也有人，只是想見我一面。」|「你，是第一個，真正與夥伴並肩站在這裡的人。」|雲層裂開，一道彩虹橫跨天空，美得讓人說不出話。"},
{k:"say",t:"鳳王展翅，七彩的光輝灑滿天空，一片羽毛輕輕落在你的手中。|鳳王：「我收下你的心意了。」|老人眼眶泛淚：「百年的等待，終於有了結果。」|鳳王之羽依然在你的包包裡發出柔和的光——它不會消失，將永遠陪伴著你。|獲得獎金 $200000！",fx:()=>{G.money+=200000;M="支線「霓光飛鴻」完成！鳳王已解除限定。"}}];
const RCP=[["義大利麵","一把煮得太軟、還黏成一坨的義大利麵"],["混凝土","一塊紮紮實實、敲起來「咚咚」響的混凝土"],["高能蛋白","一罐印著「高能」兩個大字、來路不明的蛋白粉"],["東條英雞","一尊神情肅穆、羽毛挺立的公雞擺飾"],["沉澱物","一瓶從水溝底部撈上來的沉澱物"],["螺絲釘","一根鏽到發紅的大螺絲釘"],["挖掘機","一台迷你挖掘機模型（而且會自己動）"]];
const S3=[
{k:"say",t:"你走進寶可夢中心，卻發現櫃檯空無一人。|角落裡，負責治癒的沙奈朵虛弱地靠著牆，臉色蒼白，頭上的角閃著不穩定的光。|沙奈朵：「（微弱的念力傳音）……對不起……我病了……可是外面還有好多受傷的寶可夢在等……」"},
{k:"say",t:"一位旅行訓練家焦急地探頭：「請問可以治療嗎？我的寶可夢快撐不住了！」|你看看沙奈朵，又看看門外排隊的人群。|沙奈朵：「……能不能……請你暫時……接手？」|你點了點頭：「交給我吧。」"},
{k:"say",t:"你戴上護士帽接手櫃檯，沙奈朵在一旁用念力指導你。|沙奈朵：「首先……要穩定供應傷藥。倉庫……快空了。」|你翻了翻倉庫——果然只剩下幾個空瓶。"},
{k:"buy",n:10,t:"沙奈朵：「去補貨吧……雖然這不是你的責任……」|你決定自掏腰包，買下 10 個傷藥補充倉庫。"},
{k:"say",t:"傷藥補齊了。隊伍排得整整齊齊，你一個接一個地替寶可夢治療，順利得讓你自己都有點驚訝。|沙奈朵靠在椅子上，微笑著：「……你很有天份。」|就在這時，大門被猛地撞開！|搶匪寶可夢衝了進來：「把藥通通交出來！」"},
{k:"fight",f:()=>byT([7,15],3),m:"搶匪寶可夢"},
{k:"say",t:"搶匪寶可夢夾著尾巴逃走了，訓練家們紛紛向你道謝。|但你一看架子——剛才的混亂中，大半的傷藥都被打翻或搶走了。|沙奈朵：「又……不夠了呢……」"},
{k:"buy",n:10,t:"你嘆了一口氣，又掏出錢包，再買 10 個傷藥補上缺口。|沙奈朵：「……真的，很抱歉讓你破費了。」"},
{k:"say",t:"傷藥一瓶接一瓶地擺上了架子，櫃檯卻安靜得有些不對勁。|沙奈朵依然靠在椅背上，指尖輕輕搭著額頭，臉色比剛才還要蒼白一點點。|（心中OS：奇怪……傷藥補齊了，也沒有人受傷了，為什麼她的氣色一點都沒有變好？）|你：「沙奈朵，傷藥……對你沒有用嗎？」|沙奈朵：「（微弱的念力傳音）……有的……謝謝你的心意……但那是治傷口的藥。我的病……不在傷口上。」|你：「那你是哪裡不舒服？」|沙奈朵：「……是『根』。……治癒別人的時候，我用的不是力氣，而是體力的根。這幾年，我每天都在用……用到根都快空了。」|（心中OS：原來如此。她不是累了，是被掏空了。）"},
{k:"say",t:"你：「那……到底要怎麼做，你才能好起來？」|沙奈朵沉默了很久，久到你以為她睡著了。|沙奈朵：「……有一個辦法。……我年輕的時候，聽我的前輩說過。」|（心中OS：前輩？原來她也有前輩啊……我一直以為她是一個人撐著這間中心。）|沙奈朵：「有一種藥，叫做『全滿體力丹』。吃下去，不管多累、多空……體力都會一瞬間被填滿。」|你：「這麼神奇？那要去哪裡才買得到？」|沙奈朵（苦笑）：「……買不到的。這個配方早就失傳了，連商店都沒有在賣。」|「而且我說的……是原版配方。連『根』都補得回來的那一種。」|你：「原版配方……要怎麼做？」|沙奈朵：「……我拿給你看。……不過，你看了……可能會想打我。」"},
{k:"say",t:"沙奈朵翻出一本泛黃、邊角都捲起來的筆記本，用念力飄到你面前。|你低頭一看，第一頁只寫了七行字：|　・義大利麵|　・混凝土|　・高能蛋白|　・東條英雞|　・沉澱物|　・螺絲釘|　・挖掘機|（心中OS：……這是藥方？還是哪家壞掉的餐廳的採購單？）|你：「沙奈朵，這個……是不是抄錯了？」|沙奈朵：「……沒有抄錯。我也問過前輩一模一樣的問題。」|你：「那前輩怎麼回答？」|沙奈朵：「……他說：『藥方不是拿來懂的，是拿來信的。』」|（心中OS：這位前輩，到底是賢者還是騙子啊……）"},
{k:"say",t:"你：「就算是真的……這七樣東西，我要去哪裡找？」|沙奈朵：「……野外的寶可夢，很愛撿東西。牠們會把撿到的、喜歡的、莫名其妙的東西，藏進巢穴裡當寶物。」|（心中OS：所以……是要我去跟牠們『借』？不對，是從牠們手上『贏』過來。）|沙奈朵：「……只要打贏牠們，牠們就會留下一樣寶物。……但會留下哪一樣，全看運氣。」|你：「也就是說，可能會一直拿到同一樣？」|沙奈朵：「……嗯。……很麻煩吧。對不起，要你做這種事……」|你握緊拳頭：「別道歉。你替那麼多寶可夢治療過，這一次，換我來。」|沙奈朵的眼眶微微泛紅，輕輕點了點頭。|她把筆記本推到你的手邊——清單，就記在上面了。|（心中OS：七樣東西各一份。……聽起來不難，只是，大概會是一段很長的路。）"},
{k:"gather",t:"沙奈朵：「……就拜託你了。我會在中心……等你回來。」|你：「交給我。你好好休息，別再硬撐了。」|（心中OS：好，出發吧。先把這份古怪的清單，一樣一樣打勾。）",ev:[
{n:3,t:"【途中・傍晚的傳音】|你剛打贏一場戰鬥，坐在路邊喘口氣，腦海裡忽然響起沙奈朵微弱的念力傳音。|沙奈朵：「……還好嗎？有沒有受傷……」|你：「放心，我好得很。倒是你，有沒有好好休息？」|沙奈朵：「……有。有一位旅行訓練家，主動來幫忙排隊……中心，運作得很好。」|（心中OS：看來，她不再是一個人了。這樣也好。）|沙奈朵：「……不要太勉強。材料，慢慢找就好。」|你：「知道啦，你也一樣。」"},
{n:7,t:"【途中・奇怪的收藏家】|你正擦著汗，遠處一位老婆婆推著小推車慢悠悠地走過來，車上掛著牌子：『專收奇怪的東西』。|老婆婆：「年輕人，你在找什麼呀？」|你：「呃……義大利麵、混凝土、螺絲釘，還有一台挖掘機。」|老婆婆：「哦，是『那個』配方呀！我年輕的時候，也幫一位護士找過呢。」|（心中OS：該不會……她說的護士，就是沙奈朵的前輩？）|老婆婆：「記得，千萬不要想走捷徑。那些東西，缺一不可。連挖掘機都是。」|你：「為什麼連挖掘機都不能少……」|老婆婆笑而不答，推著車子慢悠悠地走遠了，車輪聲咯吱咯吱，消失在路的盡頭。"},
{n:12,t:"【途中・深夜的決心】|露營的篝火劈啪作響。你低頭翻著筆記本，清單上已經被你畫了好幾個勾。|（心中OS：……我為什麼會這麼拚？明明只是路過寶可夢中心而已。）|你的夥伴們圍在火堆旁，一隻靠著一隻，靜靜地望著你。|（心中OS：啊，原來如此。因為牠們也被治癒過，被她接住過。）|你深吸一口氣，拍了拍自己的臉頰。|你：「好，明天繼續！」"}]},
{k:"say",t:"你把七樣東西一樣一樣擺到桌上：義大利麵、混凝土、高能蛋白、東條英雞、沉澱物、螺絲釘，最後是一台會自己在桌上跑來跑去的迷你挖掘機。|沙奈朵看著滿桌的雜物，眼睛慢慢睜大。|沙奈朵：「……真的……全部……找齊了……」|（心中OS：她的聲音在發抖。原來，她一直都不覺得我真的做得到吧。）|你：「怎麼樣，是不是很了不起？」|沙奈朵（噗哧一聲笑了出來）：「……了不起。我第一次……看見有人為了這個配方，真的把挖掘機帶回來。」|你：「你前輩呢？他也帶過挖掘機嗎？」|沙奈朵：「……他說他找到的是『挖掘機的模型』，所以只做出了半顆。」|（心中OS：……原來模型是正確答案。早知道就不用跟那隻會動的挖掘機打一架了。）"},
{k:"say",t:"沙奈朵把中心後方那口落了灰的大鍋搬了出來，用念力一件一件把材料丟進去。|義大利麵滑進鍋裡，混凝土「咚」地沉底，高能蛋白撒了一圈，東條英雞被輕輕放在最上面。沉澱物淋下去，螺絲釘叮叮噹噹地落進去，最後，迷你挖掘機自己跳了進去。|（心中OS：我現在看到的……真的是在煮藥嗎？）|鍋裡冒出一陣粉紅色的煙，味道出乎意料地……像剛烘好的麵包。|沙奈朵：「……合成，需要三個夜晚。這段期間，鍋子不能離人，也不能熄火。」|你：「那就由我來顧，你去休息。」|沙奈朵：「……不行。我也要在旁邊。這是……我的藥。」|你拉了一張椅子，在鍋邊坐下：「那我們一起。」"},
{k:"say",t:"【合成進度 1／3　第一夜】|入夜後，寶可夢中心外下起了大雨。雨滴打在窗上，像無數隻小手在輕輕敲玻璃。|鍋裡的藥液咕嘟咕嘟地冒著泡，沙奈朵坐在鍋邊，用念力輕輕攪動，粉色的光映在她蒼白的臉上。|（心中OS：很安靜……安靜得讓人有點不安。）|就在這時，大門被猛地撞開！|一位渾身濕透的少年抱著一隻奄奄一息的寶可夢衝了進來：「求求你，救救牠！」|沙奈朵掙扎著站起來：「我……來幫你。你負責穩住牠……」|你們合力治療，沙奈朵的角發出柔和的粉色光芒，包覆了整個大廳。|少年的寶可夢睜開眼睛，發出微弱的叫聲。少年哭著道謝。|沙奈朵（疲憊卻欣慰）：「……原來，治癒別人的時候……我自己也被治癒了。」|但就在此時，窗外傳來一陣騷動——"},
{k:"fight",f:()=>byT([13],3),m:"夜襲的寶可夢"},
{k:"say",t:"夜襲的寶可夢被趕走了，雨也漸漸小了。|你回頭看向大鍋——幸好，火還在，藥液也沒有溢出來。|沙奈朵（輕聲）：「……謝謝你，守住了。」|（心中OS：她的聲音，好像比剛才稍微有力了一點。……是我的錯覺嗎？）|你：「你剛才又用了治癒的力量，不會更累嗎？」|沙奈朵：「……不會。奇怪……鍋子裡的味道，好像在幫我補回一點力氣。」|你看著鍋裡冒出的粉色蒸氣，忽然覺得，這鍋怪藥，或許真的有用。|窗外，雨停了，東方開始泛白。"},
{k:"say",t:"【合成進度 2／3　第二夜】|第二個夜晚，月光透過窗戶灑進大廳。鍋裡的藥液變成了溫潤的淡金色。|你們坐在鍋邊，手裡各捧著一杯熱茶。|你：「沙奈朵，我一直想問……你為什麼會成為寶可夢中心的護士？」|沙奈朵：「……很久很久以前，我是一隻很怕痛的拉魯拉絲。」|（心中OS：拉魯拉絲……她以前，是那麼小的一隻啊。）|沙奈朵：「有一天，我的訓練家在旅途中受了重傷。我什麼都做不了，只能抱著他哭。……是一位護士，把他治好的。」|「那時候我就想，我也想變成……能夠對別人說『沒事了』的人。」|你：「所以你才會一直撐到現在。」|沙奈朵：「……是啊。我是不是很笨？把自己用到生病了，還不肯停下來。」|你：「不笨。但是，下次累了，一定要說出來。」|沙奈朵（點頭）：「……嗯。我學會了。」|你們互看了一眼，同時笑了出來。就在這時，鍋裡忽然「噗」地噴出一道煙——"},
{k:"say",t:"鍋子劇烈地搖晃起來，一股強烈得不可思議的味道衝出了大廳——義大利麵的香氣、混凝土的粉塵味、沉澱物的……總之，是一種難以形容的味道。|沙奈朵：「……糟了……味道，傳出去了。」|（心中OS：不會吧？這種味道，真的有寶可夢會被吸引嗎？）|屋外傳來一陣雜亂的腳步聲，好幾雙眼睛在窗外閃閃發亮。|你：「看來是有的。」|你把沙奈朵護在身後：「你守著鍋，這裡交給我！」"},
{k:"fight",f:()=>byT([8,12,16],3),m:"被異味吸引的寶可夢"},
{k:"say",t:"最後一隻寶可夢也夾著尾巴逃走了。|你累得靠在牆上喘氣，沙奈朵還站在鍋邊，用念力死死穩住鍋蓋。|沙奈朵：「……鍋，沒事。你呢？」|你：「我也沒事……就是有點餓。話說回來，這個味道其實不難聞，有點像……」|沙奈朵：「……像烤麵包？」|你：「對對對！為什麼會是烤麵包啊……」|你們兩個對視了一秒，然後同時爆笑出聲。|（心中OS：好久沒有這樣笑了。……她應該也是吧。）|沙奈朵笑到咳了兩聲，卻是這幾天來，第一次在臉上泛起了淡淡的血色。"},
{k:"say",t:"【合成進度 3／3　第三夜】|最後一夜，沒有雨，也沒有月亮，只有鍋子中央一圈一圈緩緩旋轉的光。|沙奈朵靠在你的肩旁，眼皮越來越沉。|沙奈朵：「……我好像……聽見前輩的聲音了。」|（心中OS：她的前輩……是不是已經不在了呢？）|沙奈朵：「前輩說過……這個配方，不是為了讓人變強，而是為了讓『一直在照顧別人的人』，也被照顧一次。」|你：「所以……這一鍋，是屬於你的。」|沙奈朵：「……是屬於『我們』的。」|你感覺到沙奈朵的念力輕輕地傳了過來，暖暖的，像一隻手，拍了拍你的肩膀。|鍋底的光，在這一刻，突然轉成了純白色。"},
{k:"say",t:"「叮——」|鍋子深處傳來一聲清脆的響聲，像是烤箱的計時器終於跳到了零。|粉色、金色、白色的光芒同時衝出鍋口，在大廳裡畫出一道溫柔的光環。|鍋底靜靜地躺著一顆圓潤、柔軟、散發著淡淡麵包香味的藥丸。|（心中OS：……這就是，全滿體力丹？）|沙奈朵用顫抖的念力把藥丸托了起來，看了好久好久。|沙奈朵：「……謝謝你。如果沒有你，這一顆……只會永遠留在筆記本裡。」|你：「趕快吃吧，別讓它涼了。」|沙奈朵（含著淚笑了）：「……嗯。」|她把藥丸放進了口中。"},
{k:"say",t:"粉紅色的光從沙奈朵的胸口緩緩擴散，包住了她的手、她的角、她的長髮。|她閉上眼睛，深深吸了一口氣，再慢慢吐了出來。|（心中OS：臉色……回來了。角上的光，也變穩了。）|沙奈朵睜開眼睛，原本黯淡的紅色眼眸，閃著柔和而堅定的光。|沙奈朵：「……我……沒有那種快要倒下去的感覺了。」|她輕輕轉了個圈，裙襬揚起一道漂亮的弧度。|沙奈朵：「雖然還不能說完全好了……但，已經差不多了。」|你：「差不多？」|沙奈朵（調皮地眨了眨眼）：「剩下的……要靠慢慢休息，還有，在跟你一起走的路上，一點一點補回來。」"},
{k:"say",t:"天亮了，晨光灑進大廳。|沙奈朵輕盈地飄到你面前，深深地鞠了一躬。|沙奈朵：「謝謝你……這幾天，你不只替我頂住了寶可夢中心，也替我找回了站起來的力氣。」|「我想……跟你一起走，讓更多寶可夢得到治癒。」|（心中OS：我原本只是想幫個小忙而已。結果，卻好像交到了一位很重要的朋友。）|你：「歡迎加入，沙奈朵。」|沙奈朵（微笑）：「……請多指教，訓練家。」|「對了，我已經把配方抄了一份，寄去商店。以後，大家都買得到全滿體力丹了。」"},
{k:"say",t:"沙奈朵成為了你的夥伴！",fx:()=>{const m=newMon(282,top3()),t=G.team.length<cap();if(t)G.team.push(m.u);const s=G.st.s3;delete s.g;delete s.n;delete s.ev;M=`支線「治癒之旅」完成！獲得沙奈朵 Lv${m.L}（${t?"加入隊伍":"送到寄放區"}），沙奈朵已解除限定。商店開始販售全滿體力丹！`}}];

const S4=[
{k:"say",t:"你把新抓到的利歐路帶到空地上。牠圓圓的眼睛閃閃發亮，對一切都很好奇。|你：「今天開始，我們來練習『波導彈』吧！」|利歐路用力把雙手往前一推——什麼都沒有發生。",fx:()=>{G.st.s4.u=Object.values(G.mons).filter(m=>m.id==447).sort((a,b)=>b.L-a.L)[0].u}},
{k:"say",t:"你耐心地示範了一遍又一遍，利歐路拚命模仿，卻只是累得氣喘吁吁。|「再來一次！集中精神，感受周圍的氣息——」|還是沒有任何光球。利歐路垂下耳朵，沮喪地坐在地上。"},
{k:"say",t:"你找來幾隻友善的野生寶可夢，請牠們幫忙當練習對手。|你：「先從基礎的開始——集中精神，把力量凝聚在掌心。」|利歐路閉上眼睛，雙掌緩緩合攏。一圈微弱的藍光閃了一下，立刻又消失了。|牠睜開眼睛，失望地看著自己的雙手。"},
{k:"fight",f:()=>[wf(66)],m:"特訓沙包"},
{k:"say",t:"第一輪特訓結束。利歐路喘著氣，卻還是不肯放棄，主動走回場中央。|你：「好樣的！再來一輪，這次換更強的對手。」"},
{k:"fight",f:()=>[wf(66),wf(67)],m:"特訓沙包（進階）"},
{k:"say",t:"你看著利歐路汗流浹背的模樣，從背包裡拿出一條毛巾替牠擦汗。|你：「累了吧？休息一下，吃點東西。」|利歐路搖搖頭，指了指自己的拳頭，示意還要再練。|你：「……好，最後一輪，全力以赴！」"},
{k:"fight",f:()=>[wf(66),wf(67),wf(68)],m:"特訓沙包（最終）"},
{k:"say",t:"訓練結束，利歐路的拳頭都紅了，卻依然放不出波導。牠把頭埋進膝蓋，不肯抬頭。|你：「別氣餒。我聽說有一位大師——小智，他的甲賀忍蛙能感應並運用波導。去找他吧。」|你牽起利歐路的手，朝著訓練家聚集的山丘出發。"},
{k:"say",t:"山丘上，一位戴著帽子的少年正與甲賀忍蛙並肩站立，彷彿融為一體。|小智：「哦？你帶來了一隻利歐路。牠的波導很純粹，只是還沒找到出口。」|「想學波導，光看是沒用的——來，跟我的甲賀忍蛙對戰吧！」"},
